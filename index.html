<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="welcome-screen">
        <h1>QuantumOS</h1>
        <p>System Status: Ready...</p>
        <button id="start-btn">Initialize System</button>
    </div>

    <div id="desktop" style="display: none;">
        
        <!-- Draggable Window 1: Terminal -->
        <div class="window" id="window1">
            <div class="window-header" id="window1-header">
                <span>Terminal</span>
                <button class="close-btn" type="button" aria-label="Close window">X</button>
            </div>
            <div class="window-content">
                <p>Connection established.</p>
                <p>Awaiting input...</p>
            </div>
        </div>

        <!-- Draggable Window 2: System Info -->
        <div class="window" id="window2">
            <div class="window-header" id="window2-header">
                <span>System Info</span>
                <button class="close-btn" type="button" aria-label="Close window">X</button>
            </div>
            <div class="window-content">
                <p>OS Version: Quantum v1.0</p>
                <p>Memory: Optimal</p>
                <p>Network: Secure</p>
                <p>CPU Temp: <span style="color: #ff3333; font-weight: bold;">85°C (WARNING)</span></p>
                <p>Uptime: <span id="uptime">00:00:00</span></p>
            </div>
        </div>

        <div class="window" id="calc-window">
            <div class="window-header" id="calc-window-header">
                <span>Calculator</span>
                <button class="close-btn" type="button" aria-label="Close window">X</button>
            </div>
            <div class="window-content calc-container">
                <input type="text" id="calc-display" disabled>
                <div class="calc-buttons">
                    <button onclick="calcType('7')">7</button>
                    <button onclick="calcType('8')">8</button>
                    <button onclick="calcType('9')">9</button>
                    <button onclick="calcType('/')">/</button>
            
                    <button onclick="calcType('4')">4</button>
                    <button onclick="calcType('5')">5</button>
                    <button onclick="calcType('6')">6</button>
                    <button onclick="calcType('*')">*</button>
            
                    <button onclick="calcType('1')">1</button>
                    <button onclick="calcType('2')">2</button>
                    <button onclick="calcType('3')">3</button>
                    <button onclick="calcType('-')">-</button>
            
                    <button onclick="calcClear()">C</button>
                    <button onclick="calcType('0')">0</button>
                    <button onclick="calcEval()">=</button>
                    <button onclick="calcType('+')">+</button>
                </div>
            </div>
        </div>

        <div id="taskbar">
            <button class="app-icon" id="icon-terminal">Terminal</button>
            <button class="app-icon" id="icon-sysinfo">System Info</button>
            <button class="app-icon" id="icon-calc">Calculator</button>
            <div id="os-clock">00:00:00</div>
        </div>

    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const desktop = document.getElementById('desktop');
        
        // Grab both windows
        const window1 = document.getElementById('window1');
        const window2 = document.getElementById('window2');
        
        // Grab ALL close buttons instead of just one
        const closeBtns = document.querySelectorAll('.close-btn');

        function showDesktop() {
            welcomeScreen.style.display = 'none';
            desktop.style.display = 'block';
            
            // Position Window 1
            window1.style.display = 'block';
            window1.style.left = '120px';
            window1.style.top = '100px';

            // Position Window 2 slightly offset from Window 1
            window2.style.display = 'block';
            window2.style.left = '520px';
            window2.style.top = '150px';
        }

        startBtn.addEventListener('click', showDesktop);

        // Loop through every close button and make it close its specific window
        closeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // e.target.closest('.window') finds the specific window this button belongs to
                e.target.closest('.window').style.display = 'none';
            });
        });

        // Make both windows draggable
        dragElement(window1);
        dragElement(window2);

        function dragElement(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = document.getElementById(elmnt.id + '-header');

            if (!header) return;

            header.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;

                const newTop = elmnt.offsetTop - pos2;
                const newLeft = elmnt.offsetLeft - pos1;

                elmnt.style.top = `${newTop}px`;
                elmnt.style.left = `${newLeft}px`;
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Taskbar App Launchers
        const iconTerminal = document.getElementById('icon-terminal');
        const iconSysInfo = document.getElementById('icon-sysinfo');

        iconTerminal.addEventListener('click', () => {
            window1.style.display = 'block';
        });

        iconSysInfo.addEventListener('click', () => {
            window2.style.display = 'block';
        });

        // Live System Clock
        function updateClock() {
            const clockElement = document.getElementById('os-clock');
            const now = new Date();
            // toLocaleTimeString() automatically formats it nicely (e.g., 10:06:40 PM)
            clockElement.textContent = now.toLocaleTimeString(); 
        }
        
        setInterval(updateClock, 1000);
        updateClock(); // Run it immediately so it doesn't show 00:00:00 for the first second
        
        // System Uptime Tracker
        let uptimeSeconds = 0;
        function updateUptime() {
            uptimeSeconds++;
            const hrs = String(Math.floor(uptimeSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((uptimeSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(uptimeSeconds % 60).padStart(2, '0');
            
            const uptimeElement = document.getElementById('uptime');
            if (uptimeElement) {
                uptimeElement.textContent = `${hrs}:${mins}:${secs}`;
            }
        }
        
        setInterval(updateUptime, 1000);

        
        dragElement(document.getElementById("calc-window"));
        document.getElementById('icon-calc').addEventListener('click', function() {
            document.getElementById('calc-window').style.display = 'block';
        });


        const display = document.getElementById('calc-display');

        function calcType(val) {
            display.value += val;
        }

        function calcClear() {
            display.value = '';
        }

        function calcEval() {
            try {
        
                display.value = eval(display.value); 
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
